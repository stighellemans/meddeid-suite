name: Public release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Validate next release candidate
        run: python scripts/verify_release_candidate.py

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked public packages
        run: |
          python -m pip install 'PyYAML>=6'
          python scripts/release_requirements.py > /tmp/meddeid-release-requirements.txt
          python -m pip install \
            --requirement /tmp/meddeid-release-requirements.txt \
            pip-audit cyclonedx-bom
          python -m pip check
      - name: Verify immutable public release
        run: python scripts/verify_release.py
      - name: Run clean-install vertical slice
        run: python scripts/verify_new_researcher_pilot.py --installed-packages --full
      - name: Verify container digests
        run: |
          python - <<'PY' > /tmp/containers.tsv
          import yaml
          lock = yaml.safe_load(open('suite-lock.yaml'))
          for item in lock['containers'].values():
              print(item['reference'], item['digest'])
          PY
          while read -r image expected; do
            actual=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
            test "$actual" = "$expected"
          done < /tmp/containers.tsv
      - name: Audit dependencies
        id: dependency-audit
        continue-on-error: true
        run: pip-audit --format=json --output=dependency-audit.json
      - name: Record dependency-audit outcome
        if: always()
        run: |
          echo "Dependency audit outcome: ${{ steps.dependency-audit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build SBOM
        if: always()
        run: cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meddeid-release-evidence
          path: |
            dependency-audit.json
            sbom.cdx.json
