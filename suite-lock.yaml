accelerators:
  cpu:
    availability: ready
    portability: linux/amd64 and linux/arm64
    recommendation: Default for the smallest pull and hosts without a supported accelerator.
  mps:
    availability: ready-native
    portability: Apple silicon with a compatible PyTorch/macOS runtime; no container
      image.
    recommendation: Use eager MPS; throughput mode enables bounded microbatching automatically.
    evidence:
      component: meddeid
      path: deploy/mps/benchmark-summary.json
      sha256: 76e9d4c709e2c0fe56962ddc2b7b6de56a80c31c0c64d36c81194c52e4b0e27b
  pytorch_cuda:
    availability: ready
    portability: NVIDIA GPUs compatible with the pinned CUDA/PyTorch runtime.
    recommendation: Portable NVIDIA default; FP16 eager avoids compile cold-start
      and image-size costs.
  tensorrt:
    availability: ready-t4
    portability: Plans are target- and runtime-specific; there is no universal TensorRT
      tag.
    recommendation: Choose the T4 image only on validated T4 hosts; request a new
      plan for another declared target.
    target_catalog:
      component: meddeid
      path: deploy/triton/targets.json
    evidence:
      component: meddeid
      path: deploy/triton/t4-benchmark-summary.json
      sha256: 572920854834cd1659b135aecc73b6844b2cb03c780fb57172193f13183bc29a
    targets:
      t4-sm75: ready
      a10g-sm86: on-request
      l4-sm89: on-request
