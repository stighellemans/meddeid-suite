accelerators:
  cpu:
    availability: ready
    portability: linux/amd64 and linux/arm64
    recommendation: Default for the smallest pull and hosts without a supported accelerator.
  mps:
    availability: ready-native
    portability: Apple silicon with a compatible PyTorch/macOS runtime; no container image.
    recommendation: Use eager MPS; throughput mode enables bounded microbatching automatically.
    evidence:
      component: meddeid
      path: deploy/mps/benchmark-summary.json
      sha256: de1989721cc7cd46fa3de318fba3af67cc95bbeebab3b98f9de52d65d1199526
  pytorch_cuda:
    availability: release-candidate
    portability: NVIDIA GPUs compatible with the pinned CUDA/PyTorch runtime.
    recommendation: Portable NVIDIA default; FP16 eager avoids compile cold-start and image-size costs.
  tensorrt:
    availability: release-candidate-t4-and-ampere-plus
    portability: Separate T4 and Ampere+ plans share one runtime; there is no universal TensorRT plan.
    recommendation: Select the model and let Compose resolve the exact T4 or hardware-compatible Ampere+ plan; use CUDA or build a plan when neither matches.
    target_catalog:
      component: meddeid
      path: deploy/triton/targets.json
    evidence:
      component: meddeid
      path: deploy/triton/t4-benchmark-summary.json
      sha256: 572920854834cd1659b135aecc73b6844b2cb03c780fb57172193f13183bc29a
    targets:
      t4-sm75: ready
      ampere-plus: ready
      a10g-sm86: on-request
      l4-sm89: on-request

